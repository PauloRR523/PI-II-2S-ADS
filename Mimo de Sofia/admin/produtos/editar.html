<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto | Mimo de Sofia</title>
</head>

<body>

    <header>
        <a href="../dashboard.html">
            <img src="../../public/assets/images/logo.png"
                 alt="Logo Mimo de Sofia">
        </a>

        <h1>Editar Produto</h1>

        <nav>
            <a href="../dashboard.html">Painel</a>
            <a href="listar.html">Produtos</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Alterar informações do produto</h2>

            <form action="#" method="post" enctype="multipart/form-data">

                <div>
                    <label for="nome">Nome do produto:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="Puxa Saco Artesanal"
                        required
                    >
                </div>

                <div>
                    <label for="categoria">Categoria:</label>

                    <select id="categoria" name="categoria" required>
                        <option value="cozinha" selected>Cozinha</option>
                        <option value="infantil">Infantil</option>
                        <option value="dia-a-dia">Dia a Dia</option>
                        <option value="brinquedos-educacionais">
                            Brinquedos Educacionais
                        </option>
                    </select>
                </div>

                <div>
                    <label for="descricao">Descrição:</label>
                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="5"
                        required
                    >Produto artesanal para cozinha.</textarea>
                </div>

                <div>
                    <label for="preco">Preço:</label>
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        min="0"
                        step="0.01"
                        value="35.00"
                    >
                </div>

                <hr>

                <section>
                    <h3>Imagem principal atual</h3>

                    <img
                        src="../../public/assets/images/produto-1.jpg"
                        alt="nome do produto"
                        width="200"
                    >

                    <div>
                        <label for="imagem_principal">
                            Substituir imagem principal:
                        </label>

                        <input
                            type="file"
                            id="imagem_principal"
                            name="imagem_principal"
                            accept="image/*"
                        >
                    </div>
                </section>

                <hr>

                <section>
                    <h3>Imagens adicionais atuais</h3>

                    <div>
                        <img
                            src="../../public/assets/images/produto-2.jpg"
                            alt="nome do produto"
                            width="150"
                        >

                        <label>
                            <input
                                type="checkbox"
                                name="remover_imagens[]"
                                value="imagem-exemplo-1"
                            >
                            Remover esta imagem
                        </label>
                    </div>

                    <div>
                        <img
                            src="../../public/assets/images/produto-3.jpg"
                            alt="nome do produto"
                            width="150"
                        >

                        <label>
                            <input
                                type="checkbox"
                                name="remover_imagens[]"
                                value="imagem-exemplo-2"
                            >
                            Remover esta imagem
                        </label>
                    </div>

                    <div>
                        <label for="imagens_adicionais">
                            Adicionar novas imagens:
                        </label>

                        <input
                            type="file"
                            id="imagens_adicionais"
                            name="imagens_adicionais[]"
                            accept="image/*"
                            multiple
                        >
                    </div>
                </section>

                <hr>

                <div>
                    <label for="status">Status do produto:</label>

                    <select id="status" name="status">
                        <option value="ativo" selected>Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>

                <div>
                    <button type="submit">Salvar alterações</button>
                    <a href="listar.html">Cancelar</a>
                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>Painel Administrativo - Mimo de Sofia</p>
    </footer>

</body>
</html>
```
