
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="descricao" content="Cadastro de produtos do Mimo de Sofia.">

    <title>Cadastrar Produto | Mimo de Sofia</title>
</head>

<body>

    <header class="admin-header">

        <div class="admin-header-container">

            <a href="../dashboard.html" class="admin-logo">
                <img src="../../public/assets/images/logo.png" alt="Mimo de Sofia">
            </a>

            <h1>Cadastrar Produto</h1>

            <a href="listar.html" class="admin-back">
                Voltar para produtos
            </a>

        </div>

    </header>


    <main class="admin-main">

        <section class="admin-intro">

            <h2>Novo produto</h2>

            <p>
                Preencha as informações abaixo para adicionar
                um produto ao catálogo do Mimo de Sofia.
            </p>

        </section>


        <section class="admin-form-section">

            <form class="admin-form" action="#" method="post" enctype="multipart/form-data">

                <div class="form-group">

                    <label for="nome">Nome do produto</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do produto"
                        required>

                </div>


                <div class="form-group">

                    <label for="categoria">Categoria</label>

                    <select id="categoria" name="categoria" required>

                        <option value="">Selecione uma categoria</option>

                        <option value="cozinha">Cozinha</option>

                        <option value="infantil">Infantil</option>

                        <option value="dia-a-dia">Dia a Dia</option>

                        <option value="brinquedos-educacionais">
                            Brinquedos Educacionais
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="descricao">Descrição do produto</label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="6"
                        placeholder="Descreva as características do produto"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label for="preco">Preço</label>

                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        min="0"
                        step="0.01"
                        placeholder="0,00">

                </div>


                <div class="form-group">

                    <label for="imagem-principal">Imagem principal</label>

                    <input
                        type="file"
                        id="imagem-principal"
                        name="imagem_principal"
                        accept="image/*"
                        required>

                </div>


                <div class="form-group">

                    <label for="imagens-adicionais">Imagens adicionais</label>

                    <input
                        type="file"
                        id="imagens-adicionais"
                        name="imagens_adicionais[]"
                        accept="image/*"
                        multiple>

                    <small>
                        Você pode selecionar mais de uma imagem.
                    </small>

                </div>


                <div class="form-group">

                    <label for="status">Status do produto</label>

                    <select id="status" name="status" required>

                        <option value="ativo">Ativo</option>

                        <option value="inativo">Inativo</option>

                    </select>

                </div>


                <div class="form-actions">

                    <button type="submit">
                        Cadastrar produto
                    </button>

                    <a href="listar.html">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>


    <footer class="admin-footer">

        <p>
            Mimo de Sofia — Painel Administrativo
        </p>

    </footer>

</body>

</html>
