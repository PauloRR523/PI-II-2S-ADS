<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/admin.css">
    <title>Configurações | Mimo de Sofia</title>
</head>
<body class="admin-config">
    <main class="config-container">
        <section class="deco-card">
            <header class="ad-header">
                <a href="dashboard.html">
                    <img
                        src="../public/assets/images/logo.png"
                        alt="Logo Mimo de Sofia"
                    >
                </a>

                <h1>Configurações do Site</h1>

                <p>Gerenciamento das informações da loja</p>

                <nav class="config-nav">
                    <a href="dashboard.html">Painel</a>
                    <a href="produtos/listar.html">Produtos</a>
                    <a href="categorias/listar.html">Categorias</a>
                </nav>
            </header>

            <div class="config-content">
                <div class="ad-title">
                    <h2>Informações gerais</h2>
                    <p>Gerencie as informações exibidas no site público.</p>
                </div>

                <form action="#" method="post" enctype="multipart/form-data">

                    <fieldset class="config-section">

                        <legend>Identificação do site</legend>

                        <div class="config-field">
                            <label for="nome_site">Nome do site</label>
                            <input
                                type="text"
                                id="nome_site"
                                name="nome_site"
                                value="Mimo de Sofia"
                                required
                            >
                        </div>

                        <div class="config-field">
                            <label for="descricao_site">Descrição do site</label>
                            <textarea
                                id="descricao_site"
                                name="descricao_site"
                                rows="4"
                            >Ateliê artesanal Mimo de Sofia.</textarea>
                        </div>

                        <div class="config-field">
                            <label for="logo">Alterar logotipo</label>
                            <input
                                type="file"
                                id="logo"
                                name="logo"
                                accept="image/*"
                            >
                        </div>
                    </fieldset>

                    <fieldset class="config-section">

                        <legend>Informações de contato</legend>

                        <div class="config-grid">
                            <div class="config-field">
                                <label for="email">E-mail</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="contato@exemplo.com"
                                >
                            </div>

                            <div class="config-field">
                                <label for="telefone">Telefone</label>
                                <input
                                    type="tel"
                                    id="telefone"
                                    name="telefone"
                                    placeholder="(00) 00000-0000"
                                >
                            </div>

                            <div class="config-field">
                                <label for="whatsapp">WhatsApp</label>
                                <input
                                    type="tel"
                                    id="whatsapp"
                                    name="whatsapp"
                                    placeholder="(00) 00000-0000"
                                >
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="config-section">

                        <legend>Redes sociais</legend>

                        <div class="config-field">
                            <label for="instagram">Instagram</label>
                            <input
                                type="url"
                                id="instagram"
                                name="instagram"
                                placeholder="https://www.instagram.com/"
                            >
                        </div>

                        <div class="config-field">
                            <label for="facebook">Facebook</label>
                            <input
                                type="url"
                                id="facebook"
                                name="facebook"
                                placeholder="https://www.facebook.com/"
                            >
                        </div>
                    </fieldset>
                    <div class="config-actions">

                        <button type="submit" class="ad-button">
                            Salvar configurações
                        </button>

                        <a href="dashboard.html" class="ad-button2">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer class="adfooter">
        <p>Mimo de Sofia - Área Administrativa</p>
    </footer>
</body>
</html>
