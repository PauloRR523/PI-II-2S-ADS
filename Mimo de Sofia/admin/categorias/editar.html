<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoria | Mimo de Sofia</title>
</head>

<body>

    <header>

        <a href="../dashboard.html">
            <img
                src="../../public/assets/images/logo.png"
                alt="Logo Mimo de Sofia"
            >
        </a>

        <h1>Editar Categoria</h1>

        <nav>
            <a href="../dashboard.html">Painel</a>
            <a href="listar.html">Categorias</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Alterar informações da categoria</h2>

            <form action="#" method="post">

                <div>
                    <label for="nome">Nome da categoria:</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="Cozinha"
                        required
                    >
                </div>

                <div>
                    <label for="descricao">Descrição:</label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="5"
                    >Produtos artesanais para cozinha.</textarea>
                </div>

                <div>
                    <label for="status">Status:</label>

                    <select id="status" name="status" required>
                        <option value="ativo" selected>Ativa</option>
                        <option value="inativo">Inativa</option>
                    </select>
                </div>

                <div>
                    <button type="submit">
                        Salvar alterações
                    </button>

                    <a href="listar.html">Cancelar</a>
                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>Painel Administrativo - Mimo de Sofia</p>
    </footer>

</body>
</html>
